<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Store</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
    header { background: #1f3864; color: #fff; padding: 16px; text-align: center; }
    #search { display: block; margin: 16px auto; padding: 8px; width: 90%; max-width: 400px; }
    #products { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; padding: 16px; }
    .card { background: #fff; padding: 12px; border-radius: 8px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    .card img { width: 100%; height: 150px; object-fit: contain; }
    .price { color: #2e7d32; font-weight: bold; }
    button { background: #1f3864; color: #fff; border: 0; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>My Simple Store</h1>
    <p>Cart items: <span id="cartCount">0</span></p>
  </header>

  <input id="search" type="text" placeholder="Search products...">
  <div id="products">Loading...</div>

  <script>
    let cart = 0;
    const list = document.getElementById("products");

    function show(products) {
      list.innerHTML = products.map(p => `
        <div class="card">
          <img src="${p.thumbnail}" alt="${p.title}">
          <h3>${p.title}</h3>
          <p class="price">$${p.price}</p>
          <button onclick="addToCart()">Add to Cart</button>
        </div>`).join("") || "No products found.";
    }

    function addToCart() {
      cart++;
      document.getElementById("cartCount").textContent = cart;
    }

    async function load(url) {
      try {
        const res = await fetch(url);
        const data = await res.json();
        show(data.products);
      } catch (e) {
        list.textContent = "Failed to load products.";
      }
    }

    document.getElementById("search").addEventListener("input", e => {
      const q = e.target.value.trim();
      load(q ? `https://dummyjson.com/products/search?q=${encodeURIComponent(q)}`
             : "https://dummyjson.com/products?limit=20");
    });

    load("https://dummyjson.com/products?limit=20");
  </script>
</body>
</html>
